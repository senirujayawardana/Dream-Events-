    <linearGradient id="body" x1="57" y1="36" x2="63" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#365C8A"/>
      <stop offset=".5" stop-color="#112C56"/>
      <stop offset="1" stop-color="#527FA5"/>
    </linearGradient>
    <style>
      .wing-left, .wing-right {
        transform-box: view-box;
        transform-origin: 60px 49px;
        animation: wingbeat .62s cubic-bezier(.45, 0, .55, 1) infinite;
      }
      .wing-right { animation-delay: -.025s; }
      @keyframes wingbeat {
        0%, 100% { transform: scaleX(1); }
        43% { transform: scaleX(.24); }
        72% { transform: scaleX(.7); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wing-left, .wing-right { animation: none; }
      }
    </style>
