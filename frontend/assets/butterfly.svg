<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <defs>
    <linearGradient id="wing-upper" x1="13" y1="8" x2="53" y2="67" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7F1F5"/>
      <stop offset=".28" stop-color="#55C7E5"/>
      <stop offset=".7" stop-color="#267EBB"/>
      <stop offset="1" stop-color="#173E75"/>
    </linearGradient>
    <linearGradient id="wing-lower" x1="18" y1="83" x2="56" y2="52" gradientUnits="userSpaceOnUse">
