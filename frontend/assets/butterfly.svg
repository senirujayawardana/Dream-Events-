      <stop offset=".42" stop-color="#287DBB"/>
      <stop offset="1" stop-color="#72D7E5"/>
    </linearGradient>
    <radialGradient id="wing-glow" cx="0" cy="0" r="1" gradientTransform="matrix(29 30 -21 20 24 19)" gradientUnits="userSpaceOnUse">
